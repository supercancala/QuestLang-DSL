[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "questlang"
version = "1.0.0"
description = "QuestLang: a declarative DSL for interactive branching text adventures"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Cristiana Espinoza" },
    { name = "David García" },
    { name = "Osvaldo Rodríguez" },
]
dependencies = ["textX>=4.0,<5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
questlang = "questlang.cli:main"

[tool.setuptools]
packages = ["questlang"]

[tool.setuptools.package-data]
questlang = ["grammar/*.tx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
